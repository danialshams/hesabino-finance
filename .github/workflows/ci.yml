name: test-and-build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: finance
          POSTGRES_PASSWORD: finance_test_only
          POSTGRES_DB: hesabino_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U finance -d hesabino_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://finance:finance_test_only@localhost:5432/hesabino_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Unit tests
        run: npm test
      - name: Type check
        run: npm run typecheck
      - name: Apply PostgreSQL migrations and integrity guards
        run: |
          npx prisma migrate deploy
          npx prisma migrate status
      - name: PostgreSQL integration tests
        run: npm run test:integration
      - name: Build
        run: npm run build